[project]
name = "lumibot-iron-condor"
version = "1.0.0"
description = "Lumibot trading bot with Tradier support"
requires-python = ">=3.12"
dependencies = [
    "lumibot>=4.6,<5",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strategies", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
