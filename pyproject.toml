[project]
name = "lumibot"
version = "1.0.0"
description = "Lumibot trading bot with Tradier support"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "python-dotenv",
    "requests",
    "tradier-api",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
