  # --- Dashboard review: position grouping, strategy comparison and display integrity ---
  # P0: misleading displayed values. P1: requested position workflow. P2: supporting verification.
  - id: dashboard-signed-value-formatting
    title: "Render every negative numeric value red consistently across the dashboard"
    status: completed
    priority: P0
    owner: antigravity
    implementation_notes:
      - "Follow-up 2026-11-01 found remaining fixed-color scalar displays. Shared numeric_text/numeric_color now cover cards and table bindings in the active Reflex views, and normalize displayed negative zero."
      - "The repeatable tools/normalize_dashboard_number_colors.py transform is idempotent. Live comparison losses, fees and negative returns were verified red."
    evidence:
      - "positions_view.py: unrealized_pl always uses GREEN; signed quantities, cost basis and Greeks use no sign-aware style."
      - "ab_lab_view.py: both net P&L cards always use GREEN, return percentages use CYAN/AMBER and fees use AMBER."
      - "benchmark_view.py: literal -0.19% drawdown uses GREEN. incubator_view.py colors net P&L by trade status and return percentages CYAN."
    acceptance:
      - "Use one numeric presentation rule for negative amounts, percentages, ratios, signed quantities and Greeks in all visible tables, cards, summaries, chart value labels and tooltips. Negative numbers are red with a visible minus sign."
      - "Use green for positive P&L/returns and neutral for zero/unavailable. Avoid a displayed -0.00 after rounding. Status and strategy colors never override numeric sign."
      - "Format currency as -$123.45 consistently; fee deductions have an explicit sign and red styling. A positive fee magnitude must be labeled as a cost."
      - "Keep raw numeric values separate from display strings. Check positive, negative, zero, rounded zero and unavailable values in light and dark appearances."
    deliverables:
