  - id: xsp-cash-settlement-lifecycle-and-fees
    title: "Account for XSP expiration cash settlement and actual fees without requiring closing fills"
    status: pending
    priority: P0
    owner: unassigned
    evidence:
      - "2026-11-04: get_reconciled_trades classifies a past-expiry ENTRY as closed and assumes gross P&L equals the full opening credit when no realization is recorded. The snapshot contains 114 entry-only rows classified closed."
      - "XSP is European style and cash settled. An expired setup can complete without a closing order; its result depends on signed leg settlement, not the passage of the expiry date alone."
    references:
      - "https://www.cboe.com/tradable_products/sp_500/mini_spx_options/cash_settlement"
      - "https://cdn.cboe.com/resources/xsp/XSP_Options_Fact_Sheet.pdf"
    acceptance:
      - "Model closed by trade, expired worthless, cash settled and expired awaiting settlement as distinct outcomes. A missing closing fill is valid for expiration; a missing settlement value or confirmation is not a full-credit profit."
      - "Use the official settlement value for the exact XSP series and expiry, signed remaining quantities and the $100 multiplier. Record the settlement source and value, and reconcile the resulting cash movement with broker activity."
      - "Compute lifecycle net P&L from opening and additional premium cash, partial and final closing cash, signed settlement cash and actual fees. Settle only remaining inventory and never count a closing fill and settlement twice."
      - "Do not invent closing execution fees on legs held to expiration. Use actual broker execution and exercise or settlement charges where available, and label any estimate separately. Missing legacy fees are unknown or estimated, not silently zero or reported as paid."
      - "Preserve pending settlement across refresh, restart and delayed cash posting. Replayed settlement evidence is idempotent, and ambiguous outcomes do not enter verified completed-trade returns or win rates."
      - "Cover all-OTM expiry, ITM put and call wings, spread boundaries, prior trims, trade closure before expiry, delayed settlement and missing fee data with deterministic fixtures. No physical-share inventory is created."
    deliverables:
      - strategies/position_ledger.py
      - trade_logger.py
      - dashboard/trade_logger.py
      - reflex_dashboard/reflex_dashboard/data/adapters.py
      - tests/test_position_ledger.py
      - tests/test_trade_logger_win_rate.py
      - tests/test_reflex_dashboard.py

