  # --- Dashboard review: position grouping, strategy comparison and display integrity ---
  # P0: misleading displayed values. P1: requested position workflow. P2: supporting verification.
  - id: dashboard-signed-value-formatting
    title: "Render every negative numeric value red consistently across the dashboard"
    status: completed
    priority: P0
    owner: antigravity
    evidence:
      - "positions_view.py: unrealized_pl always uses GREEN; signed quantities, cost basis and Greeks use no sign-aware style."
      - "ab_lab_view.py: both net P&L cards always use GREEN, return percentages use CYAN/AMBER and fees use AMBER."
      - "benchmark_view.py: literal -0.19% drawdown uses GREEN. incubator_view.py colors net P&L by trade status and return percentages CYAN."
    acceptance:
      - "Use one numeric presentation rule for negative amounts, percentages, ratios, signed quantities and Greeks in all visible tables, cards, summaries, chart value labels and tooltips. Negative numbers are red with a visible minus sign."
      - "Use green for positive P&L/returns and neutral for zero/unavailable. Avoid a displayed -0.00 after rounding. Status and strategy colors never override numeric sign."
      - "Format currency as -$123.45 consistently; fee deductions have an explicit sign and red styling. A positive fee magnitude must be labeled as a cost."
      - "Keep raw numeric values separate from display strings. Check positive, negative, zero, rounded zero and unavailable values in light and dark appearances."
    deliverables:
      - reflex_dashboard/reflex_dashboard/styles/
      - reflex_dashboard/reflex_dashboard/components/
      - reflex_dashboard/reflex_dashboard/data/adapters.py
      - dashboard/presentation.py
      - tests/test_dashboard_integrity.py
      - tests/test_reflex_dashboard.py

  - id: dashboard-telemetry-validity
    title: "Distinguish loading, empty, stale and failed data without showing fabricated balances or zero P&L"
    status: completed
    priority: P0
    owner: antigravity
    evidence:
      - "adapters.py:get_broker_telemetry starts with fixed balances and empty positions; missing marks fall back to cost basis."
      - "state.py starts with populated example account, A/B, market and model values. benchmark_view.py renders fixed performance numbers."
      - "positions_view.py claims all 14 condors hit targets and the broker confirms zero positions whenever the list is empty."
    acceptance:
      - "Represent loading, successful empty results, stale last-known data and failures explicitly for each source. Show source and last successful quote/sync timestamp."
      - "An unavailable leg mark makes that package's valuation unavailable or explicitly partial; never substitute entry cost to manufacture zero P&L."
      - "Remove live-looking sample balances, fixed benchmark results and success narratives from live states. Label a separate demo mode clearly if retained."
      - "Aggregate totals disclose excluded/unvalued positions and coverage. An API failure never implies zero exposure or no open trades."
    deliverables:
      - reflex_dashboard/reflex_dashboard/data/adapters.py
      - reflex_dashboard/reflex_dashboard/state.py
      - reflex_dashboard/reflex_dashboard/components/
      - dashboard/broker_client.py
      - dashboard/alpaca_client.py
      - tests/test_dashboard_integrity.py
      - tests/test_reflex_dashboard.py

