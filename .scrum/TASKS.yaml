      - bug-02-dynamic-leg-count-fee-accounting
      - bug-06-reflex-trade-event-aggregation-and-win-rate
      - bug-07-ledger-strike-keys-and-multi-package-attribution
    evidence:
      - "PositionLedger stores package_id, strategy_id, trade_id, broker order linkage and signed fills. Reflex positions currently read only broker-netted contract rows."
    acceptance:
      - "Join confirmed ledger ownership and fills to broker positions and quotes by account, contract and durable trade/package identity. Never infer ownership from ticker/expiry proximity alone."
      - "Separate strategy variant from actual filled structure: iron condor, bull put vertical, bear call vertical, adjusted or incomplete package."
      - "Allocate shared contracts and partial quantities without double counting; expose unmatched broker inventory as unattributed."
      - "Track one logical trade across adds, trims, replacements and explicitly linked rolls. Do not equate an order package with an entire trade lifecycle."
      - "Compute gross open P&L, realized P&L on closed portions, booked fees and total net lifecycle P&L without counting cash flows or fees twice. Label estimated exit fees separately."
      - "Reconcile package, strategy and account totals with numerical tolerances and make reconciliation gaps visible."
    deliverables:
