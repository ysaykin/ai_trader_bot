      - "Replace blanket load_all-driven broker polling with resource schedules. Proposed display defaults for evaluation: balances every 30 seconds, inventory every 15 seconds, orders every 30 seconds when idle or 5 seconds with pending orders, and needed quotes every 5 seconds. These are tunable application policies, not broker guarantees or execution freshness limits."
      - "Reuse one validated account/order snapshot within a management cycle across positions and strategies. Invalidate it after relevant broker mutations. Retain fresh authoritative checks before submission, cancellation reconciliation and broker-flat confirmation."
      - "Union and deduplicate held contracts, pending-order contracts and requested underlying symbols. Use a verified native Tradier multi-symbol quote request, chunked to provider constraints. Preserve per-symbol bid, ask, provider timestamps and missing-data status."
      - "Refresh option discovery metadata separately from tradable quotes. Coalesce concurrent cache misses and overlapping quote demand. Do not fetch complete option chains merely to value a few held legs."
      - "Prioritize pending parent orders and unknown cumulative fills. Reuse parent child-fill evidence only when the deployed SDK payload proves it complete; fetch missing child details when needed. Never infer a fill, cancellation or flat account from an old snapshot."
      - "Evaluate one shared account order-event stream to invalidate affected snapshots and target confirmation reads, with startup and reconnect reconciliation plus polling fallback. Verify sandbox support and duplicate-event handling against the deployed adapter. Sandbox market quotes still require REST because market-data streaming is live-only."
      - "Opening more browser tabs adds no broker calls at steady state. Off-screen analysis does not trigger extra telemetry reads. Reduce idle and closed-market polling while retaining pending-order and emergency monitoring."
    deliverables:
      - strategies/broker_reads.py
      - main.py
      - strategies/iron_condor.py
      - strategies/market_data_hub.py
      - dashboard/broker_client.py
      - reflex_dashboard/reflex_dashboard/state.py
      - tests/test_broker_snapshots.py
