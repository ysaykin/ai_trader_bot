  # --- Strategy integrity audit, 2026-11-04: P0 before presentation work ---
  - id: profit-target-exit-loss-investigation
    title: "Investigate XSP profit-target exits with realized losses and preserve trigger-to-fill evidence"
    status: completed
    priority: P0
    owner: antigravity
    implementation_notes:
      - "2026-11-04: Reconstructed trade lifecycles for ORB trades 01ae3697f0d44a1c90ffa2f657875ef8 and 95dbd4c2b7a9421a8c910a3b96f8c72b. Enforced a debit ceiling for discretionary profit exits (calculate_profit_exit_ceiling_debit in strategies/iron_condor_math.py). When close repricing exceeds the ceiling, the close package is canceled and withdrawn back into active position management (withdrawn_at). Protective exits (STOP_LOSS, EOD_CLOSE, ABRUPT_CLOSE) override profit-bounded triggers, submit uncapped limit orders up to wing width, and cannot be withdrawn. Decoupled trigger reasons and decision-time expected P&L from fill-based gross P&L and outcome labels (trade_logger.py and strategies/position_ledger.py). Preserved redacted replay fixture tests/fixtures/profit_target_exit_loss_2026_11_04.json and added deterministic regression tests in tests/test_regressions.py. All 370 tests pass cleanly."
    evidence:
      - "2026-11-04: Added profit-bounded discretionary pricing, withdrawal and decision evidence, a redacted ledger fixture, and fill-based outcome labels. Offline regressions and Tradier routing tests pass (100 tests); routing tests unchanged. Replay covers submission, cancellation, withdrawal and resumed management using the recorded initial limit and later debit. Verified that protective reasons override profit targets without price capping or withdrawal across EOD_CLOSE, STOP_LOSS, and ABRUPT_CLOSE."
      - "2026-11-04: ORB trades 01ae3697f0d44a1c90ffa2f657875ef8 and 95dbd4c2b7a9421a8c910a3b96f8c72b are labeled PROFIT_TARGET. Ledger opening credits of $162 and $173 and closing debits of $269 and $304 establish gross losses of $107 and $131."
      - "Both lifecycles include canceled close packages before filled replacements. The investigation established that close repricing exceeded the entry credit when discretionary orders slipped, converting profit targets into realized losses. Fixed by enforcing a debit ceiling and allowing protective exit overrides."
    acceptance:
      - "Reconstruct both lifecycles from decision logs, timestamped quotes, target settings, parent and child orders, cancellations, replacements and confirmed leg fills. Preserve a redacted replay fixture."
      - "Record the trigger reason and decision-time expected net P&L separately from final fill-based gross P&L, fees and outcome. An outcome label never derives solely from a pending exit reason or aggregate strategy P&L."
      - "Check quote freshness, signed leg quantities, credit/debit direction, target evaluation, replacement pricing and reason propagation. Fix demonstrated defects and cover the observed sequence with a deterministic regression."
      - "A valid risk exit can realize a loss. Do not block protective closes or rewrite historical reasons to make a losing trade appear profitable."
      - "Verify the corrected decision-to-fill path offline. Any new broker write verification requires its existing explicit opt-in."
    deliverables:
      - strategies/iron_condor.py
      - strategies/iron_condor_math.py
      - strategies/position_ledger.py
      - strategies/position_state.py
      - trade_logger.py
      - tests/fixtures/profit_target_exit_loss_2026_11_04.json
      - tests/test_regressions.py
      - tests/test_tradier_order_routing.py

