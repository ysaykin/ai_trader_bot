  - id: broker-coordinated-backoff-and-quota-budget
    title: "Coordinate retries and reserve broker quota for execution and recovery"
    status: completed
    priority: P1
    owner: unassigned
    implementation_notes:
      - "2026-11-02: Implemented shared token/category budgets with reserved execution capacity, bounded GET retries, jitter/cooldown, 400 Quota Violation and 429 handling, provider expiry and Retry-After support. Mutations run once and fence cached responses started before the write. Fresh-read failures remain failures for execution."
    depends_on:
      - broker-read-observability
      - broker-shared-snapshot-collector
    references:
      - https://docs.tradier.com/overview/rate-limits
      - https://docs.tradier.com/overview/error-responses
    acceptance:
      - "Enforce separate standard, market-data and trading budgets per access token and environment across processes. Track provider window expiry and quota headers. Sandbox documented allowances are 60 requests per minute in each category."
      - "Start with a background standard-read budget of at most 30 attempts per minute per token, including SDK polling and retries. Reserve the remaining standard allowance for fresh execution and recovery reads. All attempts remain inside the observed provider allowance. Defer new entries or display refreshes when necessary."
      - "Apply bounded exponential backoff with jitter to retryable GET failures, including 500, with a shared retry budget and cooldown. One failed resource enters a bounded probe mode rather than every caller starting its own retry sequence."
      - "Recognize both HTTP 429 and Tradier's documented HTTP 400 plain-text Quota Violation response. Respect provider expiry and Retry-After when present. Keep authentication and validation errors separate from transient server failures."
      - "Choose one owner for retries so SDK HTTPAdapter retries and application retries cannot multiply attempts. Count each physical attempt against the quota and deadline. Validate retry behavior against the deployed SDK."
      - "Give emergency execution and terminal-fill confirmation priority over background displays. Stale display data never authorizes an order or confirms liquidation. Preserve durable halt, execution gate, ownership and partial-fill safety when fresh data is unavailable."
      - "Do not blindly replay order submissions or modifications after ambiguous outcomes. Reconcile broker identifiers and confirmed state before any further write."
    deliverables:
      - strategies/broker_reads.py
      - main.py
      - dashboard/broker_client.py
      - strategies/iron_condor.py
      - tests/test_broker_snapshots.py
      - tests/test_emergency_liquidation.py
      - tests/test_tradier_order_routing.py

  - id: broker-cache-outage-and-load-verification
    title: "Prove dashboard continuity and broker call reduction under failures and load"
    status: completed
    priority: P1
    owner: unassigned
    implementation_notes:
      - "2026-11-02: Final gate: 323 passed, 2 expected skips, 78 subtests, with 6 independently reproduced baseline fixture failures deselected. Reflex dry compilation and full production build passed. Browser-verified cards, positions, orders and comparison during outage and recovery. Twenty strategies with two positions and two viewers used 18 standard and 24 quote requests per simulated minute for 160 symbols."
    depends_on:
      - dashboard-last-successful-snapshot
      - broker-targeted-refresh-and-quote-batching
      - broker-coordinated-backoff-and-quota-budget
    acceptance:
      - "Use a fake clock and counting HTTP transport to test success followed by repeated positions 500s, RetryError, timeout, quota rejection, malformed JSON, partial quote responses and recovery. No live broker calls are required for deterministic tests."
      - "Assert no N/A flicker after prior success within the configured display age, no fabricated zeros and no loss of known inventory on refresh failure. Verify first-load failure, valid zero, successful empty inventory and expired historical values."
      - "Run at least two dashboard sessions with the configured strategy roster and two positions per strategy. Prove one read per resource refresh generation, one quote request per batch, no concurrent duplicate misses and no increase from extra dashboard viewers."
      - "Compare baseline and final physical request counts. With display-only demand and proposed schedules, expect 8 standard calls per minute when idle or 18 with active orders, plus 12 market quote calls for one batch. Include startup, chunking, SDK work, event invalidations and retries separately in the full workload budget."
      - "Verify the shared background budget and total provider allowances in each simulated quota window. Cover simultaneous entry bursts, delayed fills and exhausted quota without dropping ownership or submitting duplicate closes."
      - "Test lease expiry, collector takeover, stale publisher rejection, process restart and account/environment switching. Confirm no cache contamination and no broker requests from ordinary UI rendering."
      - "Browser-verify balance cards, positions, orders and comparison views during an injected outage and recovery. Keep last-success timestamps truthful, show stale status, and confirm new broker data replaces retained values."
    deliverables:
