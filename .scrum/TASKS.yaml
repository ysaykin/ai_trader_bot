  - id: broker-shared-snapshot-collector
    title: "Share one broker snapshot collector across strategies and dashboard sessions"
    status: completed
    priority: P0
    owner: unassigned
    implementation_notes:
      - "2026-11-02: Implemented separate shared SQLite snapshots, per-resource leases, fenced publication, bot preference, dashboard takeover, persistent last successes, account/environment/credential isolation and native SDK GET adapters installed before polling starts. SDK guards prevent read failures from becoming empty inventory/orders."
    depends_on:
      - broker-read-observability
    review_notes:
      - "Chosen design: the running bot's broker poller publishes account snapshots into a separate shared read store. Dashboard sessions and workers read that store without HTTP on render. A dashboard fallback collector may take over through an expiring lease when the bot is absent."
      - "Use the existing shared logs volume for a separate snapshot store. Keep snapshot writes out of the ownership ledger and its execution gate. Include monotonic publication generations and reject publications from an expired collector lease."
      - "Alternative: a TTL cache in each browser session or process is smaller but still multiplies requests across sessions and containers. Alternative: a new always-on gateway adds deployment and SDK integration work. Prefer the existing bot publisher with leased fallback for this deployment."
    evidence:
      - "docker-compose.yml runs the bot and Reflex dashboard in separate containers with a shared logs volume. A Python module cache cannot deduplicate reads across those containers."
      - "MarketDataHub currently caches market data in bot memory; it neither publishes account snapshots nor serves dashboard telemetry."
    acceptance:
      - "Give balances, positions, orders and quotes independent snapshot records. Each record contains the last successful payload, success time, provider timestamp when available, latest attempt result, generation and freshness policy. A failed attempt never advances the success time."
      - "Deduplicate concurrent requests for the same resource and account into one in-flight read. Make collector acquisition, lease renewal, takeover and publication safe across process restarts. A reader never becomes a second poller merely because data is stale."
      - "Keep one account resource collector across all dashboard sessions and bot strategies. Integrate the deployed SDK polling and explicit refresh paths so they do not bypass the shared schedule or consume an untracked second allowance."
      - "Expose a nonblocking display snapshot read and a separate fresh-read request with priority, maximum age and deadline. A fresh-read failure stays a failure for trading and reconciliation, even when a display snapshot remains available."
      - "Prevent cross-account, live/sandbox and credential-scope leakage. Invalidate affected resources after confirmed broker changes and coalesce duplicate invalidations. Preserve usable display snapshots through collector restart with their original timestamps."
    deliverables:
      - strategies/broker_reads.py
      - main.py
      - strategies/market_data_hub.py
      - dashboard/broker_client.py
      - reflex_dashboard/reflex_dashboard/data/adapters.py
