  - id: dashboard-current-strategy-comparison
    title: "Compare currently held positions across selected strategies on a consistent basis"
    status: pending
    priority: P1
    owner: unassigned
    depends_on:
      - dashboard-strategy-filters
      - dashboard-configured-risk-telemetry
    acceptance:
      - "Select two or more strategies from the same positions workflow and show their current grouped positions alongside aggregate results."
      - "Separate current open P&L, realized P&L in the chosen period, booked fees, net total, open-position count and defined risk. Do not present closed-trade totals as current-position performance."
      - "Offer dollars and return on clearly defined initial risk. Calculate aggregate return as summed P&L divided by summed eligible risk, not an average of percentages."
      - "Use the same quote snapshot, filters, account scope and reporting period. Show sample size and unavailable data; closed-trade win rate excludes open trades."
      - "Keep observed P&L over time distinct from projected payoff across underlying prices. Historical series require stored snapshots and use one common time axis."
