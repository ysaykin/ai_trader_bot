  - id: dashboard-position-payoff-analysis
    title: "Graph actual position payoff and compare strategy shapes using filled legs"
    status: pending
    priority: P1
    owner: unassigned
    depends_on:
      - dashboard-owned-position-model
      - dashboard-current-strategy-comparison
    acceptance:
      - "Build the selected position's expiration payoff from actual fills, signed quantities, multipliers, strikes and booked cash flows. Support ICs and both vertical directions."
      - "Show spot, strikes, breakevens, maximum profit/loss and a visible zero line; negative numeric labels and tooltip values follow the shared red formatting rule."
      - "Distinguish actual marked open P&L from hypothetical payoff. A theoretical today curve requires an explicit pricing model, quote timestamp, IV, date, rates and dividend assumptions. Hide it when inputs are unavailable."
      - "Overlay comparable positions with aligned axes and a common valuation date. For mixed expiries, value remaining options at that date rather than pretending all legs expire together."
      - "Do not add dollar-price curves across different underlyings. Use separate plots or an explicitly labeled common percentage-shock scenario with its assumptions."
      - "Keep a labeled example-strategy gallery separate from actual holdings; the legacy assumed-strike condor A/B chart is not a live position graph."
    deliverables:
